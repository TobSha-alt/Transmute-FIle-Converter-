<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0071E3;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#5856D6;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="grad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#34C759;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#30D158;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="100" fill="url(#grad1)"/>
  <g transform="translate(128, 128)">
    <!-- File icon background -->
    <rect x="20" y="20" width="140" height="180" rx="16" fill="rgba(255,255,255,0.95)"/>
    <!-- File fold -->
    <path d="M20 40 L80 20 L140 20 L140 40 L80 40 Z" fill="rgba(255,255,255,0.85)"/>
    <!-- Arrow indicating conversion -->
    <path d="M90 70 L90 130 L70 110 M90 130 L110 110" stroke="url(#grad2)" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <!-- Second file icon -->
    <rect x="140" y="100" width="140" height="180" rx="16" fill="rgba(255,255,255,0.95)"/>
    <!-- File fold -->
    <path d="M140 120 L200 100 L260 100 L260 120 L200 120 Z" fill="rgba(255,255,255,0.85)"/>
    <!-- Checkmark indicating success -->
    <path d="M170 160 L200 190 L240 150" stroke="url(#grad2)" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  </g>
</svg>